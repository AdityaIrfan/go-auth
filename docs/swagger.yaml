  docs.DeleteEventResponse:
    properties:
      message:
        example: delete event success
        type: string
      status:
        example: success
        type: string
      status_code:
        example: 200
        type: integer
    type: object
  docs.Event:
    properties:
      created_at:
        example: "2026-09-30T08:00:00Z"
        format: date-time
        type: string
      description:
        example: Weekly planning
        type: string
      end_time:
