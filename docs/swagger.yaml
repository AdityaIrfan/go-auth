        format: date-time
        type: string
      id:
        example: c27096d8-58d1-4014-9830-96f36ab04c9f
        format: uuid
        type: string
      start_time:
        example: "2026-10-01T09:00:00+07:00"
        format: date-time
        type: string
      title:
        example: Team meeting
        type: string
      updated_at:
        example: "2026-09-30T08:00:00Z"
        format: date-time
        type: string
      user_id:
        example: c8721202-510d-4a9a-b1d5-30b78c01d73b
        format: uuid
        type: string
    type: object
  docs.EventIDErrorResponse:
    properties:
      message:
        example: invalid event id
        type: string
      status:
        example: failed
        type: string
      status_code:
        example: 400
        type: integer
    type: object
  docs.EventNotFoundResponse:
    properties:
      message:
        example: event not found
        type: string
      status:
        example: failed
        type: string
      status_code:
        example: 404
        type: integer
    type: object
  docs.EventRequest:
    properties:
      description:
        example: Weekly planning
        type: string
      end_time:
        example: "2026-10-01T10:00:00+07:00"
        format: date-time
        type: string
      start_time:
        example: "2026-10-01T09:00:00+07:00"
        format: date-time
        type: string
      title:
        example: Team meeting
        type: string
    required:
    - end_time
    - start_time
    - title
    type: object
  docs.HealthResponse:
    properties:
      message:
        example: I'm healthy
        type: string
      status:
        example: success
        type: string
      status_code:
        example: 200
        type: integer
    type: object
  docs.JWTErrorResponse:
    properties:
      message:
        example: invalid or expired token
        type: string
      status:
        example: failed
        type: string
      status_code:
        example: 401
        type: integer
    type: object
  docs.ListEventRequest:
    properties:
      end_time:
        example: "2026-10-02T00:00:00+07:00"
        format: date-time
        type: string
      start_time:
        example: "2026-10-01T00:00:00+07:00"
        format: date-time
        type: string
    type: object
  docs.ListEventsErrorResponse:
    properties:
      message:
        example: list events failed
        type: string
      status:
        example: failed
        type: string
      status_code:
        example: 422
        type: integer
    type: object
  docs.ListEventsResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/docs.Event'
        type: array
      message:
        example: list events success
        type: string
      status:
        example: success
        type: string
      status_code:
        example: 200
        type: integer
    type: object
  docs.LoginErrorResponse:
    properties:
      message:
        example: login failed
        type: string
      status:
        example: failed
        type: string
      status_code:
        example: 422
        type: integer
    type: object
  docs.LoginRequest:
    properties:
      email:
        example: user@example.com
        format: email
        type: string
      password:
        example: secret123
        type: string
    required:
    - email
    - password
    type: object
  docs.LoginSuccessResponse:
    properties:
      data:
        $ref: '#/definitions/docs.TokenData'
      message:
        example: login success
        type: string
      status:
        example: success
        type: string
      status_code:
        example: 200
        type: integer
    type: object
  docs.LogoutErrorResponse:
    properties:
      message:
        example: logout failed
        type: string
      status:
        example: failed
        type: string
      status_code:
        example: 422
        type: integer
    type: object
  docs.LogoutSuccessResponse:
    properties:
      message:
        example: logout success
        type: string
      status:
        example: success
        type: string
      status_code:
        example: 200
        type: integer
    type: object
  docs.OAuthExchangeErrorResponse:
    properties:
      message:
        example: login failed
        type: string
      status:
        example: failed
        type: string
      status_code:
        example: 401
        type: integer
    type: object
  docs.ReadinessErrorResponse:
    properties:
      message:
        example: unavailable
        type: string
      status:
        example: failed
        type: string
      status_code:
        example: 503
        type: integer
    type: object
  docs.ReadyResponse:
    properties:
      message:
        example: I'm ready
        type: string
      status:
        example: success
        type: string
      status_code:
        example: 200
        type: integer
    type: object
  docs.RecoveryErrorResponse:
    properties:
      message:
        example: Internal Server Error
        type: string
    type: object
  docs.RefreshErrorResponse:
    properties:
      message:
        example: refresh token failed
        type: string
      status:
        example: failed
        type: string
      status_code:
        example: 422
        type: integer
    type: object
  docs.RefreshRequest:
    properties:
      refresh_token:
        example: <refresh-jwt>
        type: string
    required:
    - refresh_token
    type: object
  docs.RefreshSuccessResponse:
    properties:
      data:
        $ref: '#/definitions/docs.TokenData'
      message:
        example: refresh token success
        type: string
      status:
        example: success
        type: string
      status_code:
        example: 200
        type: integer
    type: object
  docs.RegisterErrorResponse:
    properties:
      message:
        example: register failed
        type: string
      status:
        example: failed
        type: string
      status_code:
        example: 422
        type: integer
    type: object
  docs.RegisterRequest:
    properties:
      email:
        example: user@example.com
        format: email
        type: string
      name:
        example: Jane Doe
        type: string
      password:
        example: secret123
        minLength: 6
        type: string
    required:
    - email
    - name
    - password
    type: object
  docs.RegisterSuccessResponse:
    properties:
      message:
        example: register success, do login
        type: string
      status:
        example: success
        type: string
      status_code:
        example: 201
        type: integer
    type: object
  docs.TokenData:
    properties:
      access_token:
        example: <access-jwt>
        type: string
      expires_in:
        example: 86400
        type: integer
      refresh_token:
        example: <refresh-jwt>
        type: string
      token_type:
        example: Bearer
        type: string
    type: object
  docs.UpdateEventErrorResponse:
    properties:
      message:
        example: update event failed
        type: string
      status:
        example: failed
        type: string
      status_code:
        example: 422
        type: integer
    type: object
  docs.UpdateEventResponse:
    properties:
      data:
        $ref: '#/definitions/docs.Event'
      message:
        example: update event success
        type: string
      status:
        example: success
        type: string
      status_code:
        example: 200
        type: integer
    type: object
  docs.ValidationErrorResponse:
    properties:
      message:
        example: invalid request body
        type: string
      status:
        example: failed
        type: string
      status_code:
        example: 400
        type: integer
    type: object
info:
  contact: {}
  description: Authentication, refresh tokens, and user-owned calendar events. Responses
    mirror the current runtime, including its documented limitations.
  title: KDA Auth and Calendar Service API
  version: "1.0"
paths:
  /api/v1/auth/google/callback:
    get:
      description: Exchanges authorization code for an ID token, checks Google tokeninfo,
        finds or creates the user by email, and issues application tokens.
      parameters:
      - description: Google authorization code
        in: query
        name: code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Token pair
          schema:
            $ref: '#/definitions/docs.LoginSuccessResponse'
        "401":
          description: Code exchange failed or ID token missing
          schema:
            $ref: '#/definitions/docs.OAuthExchangeErrorResponse'
        "422":
          description: Tokeninfo, audience, repository, or token persistence failure
          schema:
            $ref: '#/definitions/docs.LoginErrorResponse'
        "500":
          description: Current tokeninfo missing-claims panic, recovered by application
            middleware
          schema:
            $ref: '#/definitions/docs.RecoveryErrorResponse'
      summary: Google OAuth2 callback
      tags:
      - Authentication
  /api/v1/auth/google/login:
    get:
      description: Open in a browser; redirects with openid, email, profile scopes.
        Generated state is currently not persisted or validated.
      produces:
      - application/json
      responses:
        "307":
          description: Temporary redirect to Google
          headers:
            Location:
              description: Google authorization URL
              type: string
      summary: Start Google OAuth2 login
      tags:
      - Authentication
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Returns access and refresh JWTs. Access token is stored in Redis.
        Refresh lifetime is access lifetime plus one hour.
      parameters:
      - description: Request JSON
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/docs.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Token pair
          schema:
            $ref: '#/definitions/docs.LoginSuccessResponse'
        "400":
          description: Invalid JSON or required fields; errors details are omitted
            by the current response helper
          schema:
            $ref: '#/definitions/docs.ValidationErrorResponse'
        "401":
          description: Invalid credentials or non-email provider
          schema:
            $ref: '#/definitions/docs.CredentialErrorResponse'
        "422":
          description: Token generation or Redis store failure
          schema:
            $ref: '#/definitions/docs.LoginErrorResponse'
      summary: Login email/password
      tags:
      - Authentication
  /api/v1/auth/logout:
    post:
      description: Deletes the supplied access token from Redis. Middleware validates
        JWT signature/expiry only; it does not consult Redis.
      produces:
      - application/json
      responses:
        "200":
          description: Logged out
          schema:
            $ref: '#/definitions/docs.LogoutSuccessResponse'
        "401":
          description: Missing, invalid, or expired JWT
          schema:
            $ref: '#/definitions/docs.JWTErrorResponse'
        "422":
          description: Redis revoke failed
          schema:
            $ref: '#/definitions/docs.LogoutErrorResponse'
      security:
      - BearerAuth: []
      summary: Revoke access token in Redis
      tags:
      - Authentication
  /api/v1/auth/refresh:
    post:
      consumes:
      - application/json
      description: Public route. Validates the submitted JWT, looks up its user, and
        returns a new pair. No Redis validation or refresh-token rotation/revocation
        check is performed. Current verifier does not distinguish access tokens from
        refresh tokens.
      parameters:
      - description: Request JSON
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/docs.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Token pair
          schema:
            $ref: '#/definitions/docs.RefreshSuccessResponse'
        "400":
          description: Invalid JSON or required fields; errors details are omitted
            by the current response helper
          schema:
            $ref: '#/definitions/docs.ValidationErrorResponse'
        "422":
          description: Invalid JWT, database, token generation, or Redis failure
          schema:
            $ref: '#/definitions/docs.RefreshErrorResponse'
        "500":
          description: Current missing-user panic, recovered by application middleware
          schema:
            $ref: '#/definitions/docs.RecoveryErrorResponse'
      summary: Refresh token pair
      tags:
      - Authentication
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      description: Requires valid email, password of at least six characters, and
        name. Duplicate email returns 400 with message email already registered.
      parameters:
      - description: Request JSON
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/docs.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: User created
          schema:
            $ref: '#/definitions/docs.RegisterSuccessResponse'
        "400":
          description: 'Invalid input or duplicate email (message: email already registered)'
          schema:
            $ref: '#/definitions/docs.ValidationErrorResponse'
        "422":
          description: Lookup, password hashing, or persistence failure
          schema:
            $ref: '#/definitions/docs.RegisterErrorResponse'
      summary: Register email/password
      tags:
      - Authentication
  /api/v1/events:
    get:
      consumes:
      - application/json
      description: Optional JSON body filters start_time >= supplied start_time and
        end_time <= supplied end_time, ordered by start_time ASC. Query parameters
        are ignored because request fields have no query tags. Empty body returns
        all user events. GET bodies may not be supported by browser Swagger UI; use
        curl for filtered requests. No request validation is performed.
      parameters:
      - description: Request JSON
        in: body
        name: request
        schema:
          $ref: '#/definitions/docs.ListEventRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Events, empty array when none
          schema:
            $ref: '#/definitions/docs.ListEventsResponse'
        "400":
          description: Invalid JSON or required fields; errors details are omitted
            by the current response helper
          schema:
            $ref: '#/definitions/docs.ValidationErrorResponse'
        "401":
          description: Missing, invalid, or expired JWT
          schema:
            $ref: '#/definitions/docs.JWTErrorResponse'
        "422":
          description: Query failure
          schema:
            $ref: '#/definitions/docs.ListEventsErrorResponse'
      security:
      - BearerAuth: []
      summary: List user events
      tags:
      - Events
    post:
      consumes:
      - application/json
      description: User ID comes from JWT. Title and timestamps are required; end_time
        must be strictly after start_time. Date-time values use RFC3339.
      parameters:
      - description: Request JSON
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/docs.EventRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/docs.CreateEventResponse'
        "400":
          description: Invalid input or end_time must be after start_time
          schema:
            $ref: '#/definitions/docs.ValidationErrorResponse'
        "401":
          description: Missing, invalid, or expired JWT
          schema:
            $ref: '#/definitions/docs.JWTErrorResponse'
        "422":
          description: Persistence failure
          schema:
            $ref: '#/definitions/docs.CreateEventErrorResponse'
      security:
      - BearerAuth: []
      summary: Create event
      tags:
      - Events
  /api/v1/events/{id}:
    delete:
      description: Only the JWT owner can delete. Lookup errors all return 404.
      parameters:
      - description: Event UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Deleted
          schema:
            $ref: '#/definitions/docs.DeleteEventResponse'
        "400":
          description: Invalid event UUID
          schema:
            $ref: '#/definitions/docs.EventIDErrorResponse'
        "401":
          description: Missing, invalid, or expired JWT
          schema:
            $ref: '#/definitions/docs.JWTErrorResponse'
        "404":
          description: Not found for this user or lookup failure
          schema:
            $ref: '#/definitions/docs.EventNotFoundResponse'
        "422":
          description: Delete failure
          schema:
            $ref: '#/definitions/docs.DeleteEventErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete event
      tags:
      - Events
    put:
      consumes:
      - application/json
      description: Only the JWT owner can update. Title and both times are required.
        Unlike create, equal start_time and end_time are currently accepted. Lookup
        errors all return 404.
      parameters:
      - description: Request JSON
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/docs.EventRequest'
      - description: Event UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Updated
          schema:
            $ref: '#/definitions/docs.UpdateEventResponse'
        "400":
          description: Invalid event id, invalid input, or end_time must be after
            start_time
          schema:
            $ref: '#/definitions/docs.ValidationErrorResponse'
        "401":
          description: Missing, invalid, or expired JWT
          schema:
            $ref: '#/definitions/docs.JWTErrorResponse'
        "404":
          description: Not found for this user or lookup failure
          schema:
            $ref: '#/definitions/docs.EventNotFoundResponse'
        "422":
          description: Persistence failure
          schema:
            $ref: '#/definitions/docs.UpdateEventErrorResponse'
      security:
      - BearerAuth: []
      summary: Replace event fields
      tags:
      - Events
  /health:
    get:
      description: Returns the standard success envelope.
      produces:
      - application/json
      responses:
        "200":
          description: Healthy
          schema:
            $ref: '#/definitions/docs.HealthResponse'
      summary: Liveness check
      tags:
      - System
  /ready:
    get:
      description: Pings PostgreSQL and Redis. Dependency details are currently discarded
        by the response helper.
      produces:
      - application/json
      responses:
        "200":
          description: Ready
          schema:
            $ref: '#/definitions/docs.ReadyResponse'
        "503":
          description: One or both dependencies unavailable
          schema:
            $ref: '#/definitions/docs.ReadinessErrorResponse'
      summary: Readiness check
      tags:
      - System
schemes:
- http
- https
securityDefinitions:
  BearerAuth:
    description: Bearer {access_token}
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
