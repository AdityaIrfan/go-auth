services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: kda_user
      POSTGRES_PASSWORD: kda_password
      POSTGRES_DB: kda_auth_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  api:
    image: golang:1.27-alpine
    working_dir: /app
    volumes:
      - ../:/app
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=postgres
      - DB_USER=kda_user
      - DB_PASSWORD=kda_password
      - DB_NAME=kda_auth_db
      - DB_PORT=5432
      - REDIS_HOST=redis:6379
      - REDIS_PASSWORD=
      - JWT_SECRET=local-development-secret-change-me
      - JWT_EXPIRATION_HOURS=24
      - GOOGLE_CLIENT_ID=your-google-client-id.apps.googleusercontent.com
      - GOOGLE_CLIENT_SECRET={google_client_secret}
      - GOOGLE_REDIRECT_URL={google_redirect_url}
    command: >
      sh -c "go install github.com/air-verse/air@latest && air -c .air.toml"
    depends_on:
      - postgres
      - redis

volumes:
  pgdata:
  redisdata:
